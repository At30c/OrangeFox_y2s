name: Build OrangeFox

# Builds OrangeFox (fox_12.1) for the Galaxy S20+ 5G (y2s) and LTE (y2slte) on a GitHub-hosted runner.
# The device tree lives in device/samsung/y2s; each variant uses its own prebuilt kernel set.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Check out the device tree
        uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig rsync bc python3 python-is-python3 \
            repo openjdk-11-jdk
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Sync OrangeFox fox_12.1
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/fox_sync"
          cd "$HOME/fox_sync"
          ./orangefox_sync.sh --branch 12.1 --path "$HOME/fox_12.1"
          df -h /

      - name: Add the device tree
        run: |
          mkdir -p "$HOME/fox_12.1/device/samsung"
          cp -r "$GITHUB_WORKSPACE/device/samsung/y2s" "$HOME/fox_12.1/device/samsung/y2s"

      - name: Build
        run: |
          cd "$HOME/fox_12.1"
          mkdir -p "$GITHUB_WORKSPACE/release"
          for variant in y2slte y2s; do
            if [ ! -f "device/samsung/y2s/prebuilt/$variant/Image" ]; then
              echo "Skipping $variant: no prebuilt kernel imported yet."
              continue
            fi
            rm -f out/target/product/y2s/recovery.img out/target/product/y2s/kernel \
              out/target/product/y2s/dtbo.img out/target/product/y2s/OrangeFox*.zip
            (
              set +u
              export FOX_VARIANT="$variant"
              source build/envsetup.sh
              lunch twrp_y2s-eng
              mka adbd recoveryimage
            )
            cp out/target/product/y2s/recovery.img "$GITHUB_WORKSPACE/release/OrangeFox_${variant}_recovery.img"
            for zip in out/target/product/y2s/OrangeFox*.zip; do
              [ -f "$zip" ] && cp "$zip" "$GITHUB_WORKSPACE/release/"
            done
          done
          cd "$GITHUB_WORKSPACE/release" && sha256sum * > SHA256SUMS && ls -l

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_y2s
          path: release/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
